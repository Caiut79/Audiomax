<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Audiomax CRM">
  <defs>
    <!-- Gradiente del brand: replica esatta di .brand-mark (135deg) -->
    <linearGradient id="am-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="0.55" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <!-- Riflesso superiore: replica dell'inset highlight del brand-mark -->
    <linearGradient id="am-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#am-brand)" />
  <rect width="512" height="240" rx="118" fill="url(#am-gloss)" />

  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="206" font-weight="800" letter-spacing="-6" fill="#ffffff">AM</text>
</svg>
